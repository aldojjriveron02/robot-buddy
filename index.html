<!DOCTYPE html><html><head><meta charset="utf-8"><title>Buddy Brain Test</title></head>
<body>
<h1>Buddy Self-Test v5 - full flow, 135M q8, 8 turns</h1>
<div id="log" style="font-family:monospace;white-space:pre-wrap"></div>
<script>
const logEl = document.getElementById('log');
function log(m){ logEl.textContent += m + "\n"; }
window.addEventListener('error', e => log('WINDOW ERROR: ' + e.message));
log('page loaded, importing library...');
</script>
<script type="module">
const logEl = document.getElementById('log');
function log(m){ logEl.textContent += m + "\n"; }
// --- replicate the app's logic ---
let notebook = ["My human's name is Aldo.", "Aldo lives in Miami.", "Aldo builds robot games."];
let history = []; // {role, content}
function systemMsg(){
  return "You are Buddy, a friendly little robot who lives in a phone. You are cheerful and loyal. Keep every answer short: one or two sentences. Do not ask questions back unless it fits naturally." + (notebook.length ? " Facts you know: " + notebook.join(' ') : "");
}
function cleanReply(t){
  t = t.trim();
  const blank = t.indexOf('\n\n'); if (blank > 0) t = t.slice(0, blank);
  let lines = t.split('\n').map(s=>s.trim()).filter(Boolean);
  lines = lines.filter(l => !(l.endsWith('?') && /^(what|who|where|when|why|how|do you|can you|would you|is|are)/i.test(l)));
  t = lines.join(' ');
  const sents = t.split(/(?<=[.!?])\s+/);
  return sents.slice(0,3).join(' ').trim();
}
try {
  const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2/dist/transformers.min.js');
  log('library imported OK');
  env.allowLocalModels = false;
  const gen = await pipeline('text-generation', 'onnx-community/SmolLM2-135M-Instruct-ONNX', { dtype: 'q8',
    progress_callback: p => { if(p.status==='done') log('dl done: ' + p.file); }});
  log('PIPELINE READY');
  const nameMatch = notebook.join(' ').match(/name is ([A-Za-z]+)/i);
  const nm = nameMatch ? nameMatch[1] : 'friend';
  const greeting = "Beep boop — hi, " + nm + "! I'm Buddy. My brain lives right here in this page now. Ask me anything!";
  log('GREETING: ' + greeting);
  async function chat(userText){
    if (/^remember\b/i.test(userText)) {
      const fact = userText.replace(/^remember:?\s*/i,'').trim();
      if (fact) { notebook.push(fact.endsWith('.') ? fact : fact + '.'); }
      const confirm = "Got it — written in my notebook: " + fact;
      log('USER: ' + userText); log('BUDDY: ' + confirm + ' (taught, no generation)');
      return;
    }
    const t0 = performance.now();
    const msgs = [{role:'system',content:systemMsg()}, ...history.slice(-4), {role:'user',content:userText}];
    const out = await gen(msgs, { max_new_tokens: 60, temperature: 0.7, do_sample: true });
    const gt = out[0].generated_text;
    const raw = Array.isArray(gt) ? gt[gt.length-1].content : String(gt);
    const reply = cleanReply(raw);
    const dt = Math.round(performance.now() - t0);
    history.push({role:'user',content:userText},{role:'assistant',content:reply});
    log('USER: ' + userText);
    log('BUDDY (' + dt + 'ms): ' + (reply || '[EMPTY]'));
    if (!reply) throw new Error('EmptyTestReply at turn: ' + userText);
  }
  await chat('Tell me a short joke.');
  await chat('What is the capital of France?');
  await chat('remember my shop is called Miami Fixes');
  await chat('Who is your human and where does he live?');
  await chat('What is my shop called?');
  await chat('Tell me a robot poem.');
  await chat('What did you just tell me about my shop?');
  await chat('Why is the sky blue?');
  log('notebook now: ' + JSON.stringify(notebook));
  log('ALL DONE — 8 turns survived');
  document.title = 'BUDDY TEST PASS';
} catch(e) {
  log('FAILED: ' + (e && e.message ? e.message : e));
  document.title = 'BUDDY TEST FAIL';
}
</script>
</body></html>
